<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <!-- Background circle -->
  <circle cx="40" cy="40" r="40" fill="#C8956C"/>

  <!-- Shirt & collar -->
  <path d="M0 80 C6 58 26 52 40 50 C54 52 74 58 80 80Z" fill="#1E3A5F"/>
  <path d="M35 50 L40 59 L45 50" fill="white"/>
  <path d="M35 50 L40 56 L45 50" fill="#1E3A5F"/>

  <!-- Neck -->
  <rect x="34" y="43" width="12" height="10" rx="3" fill="#B87248"/>

  <!-- Head -->
  <ellipse cx="40" cy="33" rx="20" ry="22" fill="#C8845A"/>

  <!-- Hair - dark, neat, side part -->
  <path d="M20 26 Q22 12 40 11 Q58 12 60 26 Q56 15 40 14 Q24 15 20 26Z" fill="#1A0E07"/>
  <path d="M20 26 Q20 19 23 15" stroke="#1A0E07" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M60 26 Q60 22 58 17" stroke="#1A0E07" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Left ear -->
  <ellipse cx="20" cy="35" rx="3.5" ry="4.5" fill="#B87248"/>
  <!-- Right ear -->
  <ellipse cx="60" cy="35" rx="3.5" ry="4.5" fill="#B87248"/>

  <!-- Eyes whites -->
  <ellipse cx="31" cy="33" rx="5" ry="5" fill="white"/>
  <ellipse cx="49" cy="33" rx="5" ry="5" fill="white"/>
  <!-- Irises -->
  <circle cx="32" cy="34" r="3.2" fill="#3B2010"/>
  <circle cx="50" cy="34" r="3.2" fill="#3B2010"/>
  <!-- Pupils -->
  <circle cx="32.5" cy="34" r="1.5" fill="#0A0604"/>
  <circle cx="50.5" cy="34" r="1.5" fill="#0A0604"/>
  <!-- Eye shine -->
  <circle cx="33.5" cy="33" r="1" fill="white"/>
  <circle cx="51.5" cy="33" r="1" fill="white"/>

  <!-- Eyebrows - natural dark -->
  <path d="M26 27 Q31 25 36 27" stroke="#1A0E07" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M44 27 Q49 25 54 27" stroke="#1A0E07" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Nose bridge + nostrils -->
  <path d="M38 37 Q40 43 42 37" stroke="#9A6040" stroke-width="1.3" fill="none" stroke-linecap="round"/>
  <ellipse cx="37.5" cy="43" rx="2.2" ry="1.5" fill="#A05A30" opacity="0.5"/>
  <ellipse cx="42.5" cy="43" rx="2.2" ry="1.5" fill="#A05A30" opacity="0.5"/>

  <!-- Smile with teeth -->
  <path d="M33 49 Q40 55 47 49" fill="#B55E35"/>
  <path d="M34 49 Q40 54 46 49" fill="white"/>
  <line x1="40" y1="49" x2="40" y2="54" stroke="#D0896A" stroke-width="0.8" opacity="0.6"/>

  <!-- Cheek blush -->
  <ellipse cx="24" cy="40" rx="4" ry="2.5" fill="#D07050" opacity="0.25"/>
  <ellipse cx="56" cy="40" rx="4" ry="2.5" fill="#D07050" opacity="0.25"/>
</svg>
