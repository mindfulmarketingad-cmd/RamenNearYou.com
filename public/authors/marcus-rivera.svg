<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <!-- Background -->
  <circle cx="40" cy="40" r="40" fill="#A07050"/>

  <!-- Shirt - olive green -->
  <path d="M0 80 C6 58 26 52 40 50 C54 52 74 58 80 80Z" fill="#4A5D3A"/>
  <!-- Crew neck -->
  <path d="M32 50 Q40 56 48 50 Q44 53 40 53 Q36 53 32 50Z" fill="#3A4D2A"/>

  <!-- Neck -->
  <rect x="34" y="43" width="12" height="10" rx="3" fill="#9A6840"/>

  <!-- Head -->
  <ellipse cx="40" cy="33" rx="20" ry="22" fill="#A87050"/>

  <!-- Short curly hair -->
  <path d="M20 28 Q22 13 40 12 Q58 13 60 28 Q56 17 40 16 Q24 17 20 28Z" fill="#1A0E07"/>
  <!-- Curly texture dots -->
  <circle cx="26" cy="20" r="2" fill="#0A0604"/>
  <circle cx="32" cy="16" r="2" fill="#0A0604"/>
  <circle cx="40" cy="14" r="2" fill="#0A0604"/>
  <circle cx="48" cy="16" r="2" fill="#0A0604"/>
  <circle cx="54" cy="20" r="2" fill="#0A0604"/>
  <circle cx="22" cy="24" r="1.8" fill="#0A0604"/>
  <circle cx="58" cy="24" r="1.8" fill="#0A0604"/>

  <!-- Ears -->
  <ellipse cx="20" cy="36" rx="3.5" ry="4.5" fill="#9A6840"/>
  <ellipse cx="60" cy="36" rx="3.5" ry="4.5" fill="#9A6840"/>

  <!-- Eyes -->
  <ellipse cx="31" cy="34" rx="5" ry="4.5" fill="white"/>
  <ellipse cx="49" cy="34" rx="5" ry="4.5" fill="white"/>
  <circle cx="32" cy="34.5" r="3" fill="#3B2010"/>
  <circle cx="50" cy="34.5" r="3" fill="#3B2010"/>
  <circle cx="32.5" cy="34.5" r="1.3" fill="#0A0604"/>
  <circle cx="50.5" cy="34.5" r="1.3" fill="#0A0604"/>
  <circle cx="33.5" cy="33.5" r="0.9" fill="white"/>
  <circle cx="51.5" cy="33.5" r="0.9" fill="white"/>

  <!-- Eyebrows - thick -->
  <path d="M26 28 Q31 26 36 28" stroke="#1A0E07" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <path d="M44 28 Q49 26 54 28" stroke="#1A0E07" stroke-width="2.2" fill="none" stroke-linecap="round"/>

  <!-- Nose -->
  <path d="M38 38 Q40 44 42 38" stroke="#7A5430" stroke-width="1.3" fill="none" stroke-linecap="round"/>
  <ellipse cx="38" cy="44" rx="1.8" ry="1.2" fill="#7A5430" opacity="0.5"/>
  <ellipse cx="42" cy="44" rx="1.8" ry="1.2" fill="#7A5430" opacity="0.5"/>

  <!-- Beard/stubble shadow -->
  <ellipse cx="40" cy="48" rx="14" ry="6" fill="#3A2818" opacity="0.18"/>

  <!-- Mustache -->
  <path d="M34 47 Q40 49 46 47 Q42 48 40 48 Q38 48 34 47Z" fill="#1A0E07"/>

  <!-- Smile -->
  <path d="M34 50 Q40 55 46 50" stroke="#6A3520" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <path d="M35 50 Q40 53 45 50" fill="white"/>

  <!-- Cheek -->
  <ellipse cx="24" cy="42" rx="3.5" ry="2.2" fill="#C06050" opacity="0.2"/>
  <ellipse cx="56" cy="42" rx="3.5" ry="2.2" fill="#C06050" opacity="0.2"/>
</svg>
